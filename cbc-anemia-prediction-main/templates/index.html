<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CBC Analyzer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f0f4f8;
      padding: 50px 15px;
      font-family: 'Segoe UI', sans-serif;
    }
    .container {
      max-width: 700px;
      margin: auto;
    }
    .card {
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.05);
      background-color: #ffffff;
    }
    .form-label {
      font-weight: 500;
      font-size: 1.5rem;
    }
    .btn-primary {
      background-color: #4887c6;
      border-color: #004080;
      font-weight: bold;
    }
    .btn-primary:hover {
      background-color: #29578d;
    }
    .result-box {
      display: none;
      margin-top: 30px;
      padding: 25px;
      border-radius: 12px;
      background-color: #ffffff;
      box-shadow: 0 6px 20px rgba(0,0,0,0.05);
      animation: fadeIn 0.6s ease-in-out forwards;
    }
    .result-box.show {
      display: block;
    }
    .shap-img {
      max-width: 100%;
      height: auto;
      border-radius: 6px;
      border: 1px solid #ccc;
      margin-top: 15px;
    }
    .age {
      font-size: 1.3rem;
    }
    @keyframes fadeIn {
      from {opacity: 0;}
      to {opacity: 1;}
    }
  </style>
</head>
<body>

<div class="container">
  <h1 class="text-center mb-5 text-primary">🩺 CBC Test Report Analyzer</h1>

  <form action="/predict" method="POST" enctype="multipart/form-data" class="card p-4">
    <div class="mb-4">
      <label for="pdf_file" class="form-label">📄 Upload PDF Report</label>
      <input type="file" class="form-control form-control-lg" id="pdf_file" name="pdf_file" accept=".pdf" required>
    </div>

    <div class="row mb-4">
      <div class="col-md-6">
        <label for="age" class="form-label age "> Age</label>
        <input type="number" class="form-control form-control-lg" id="age" name="age" required>
      </div>
      <div class="col-md-6">
        <label for="gender" class="form-label age">👤 Gender</label>
        <select class="form-select form-select-lg" id="gender" name="gender" required>
          <option selected disabled>Choose...</option>
          <option value="Female">Female</option>
          <option value="Male">Male</option>
        </select>
      </div>
    </div>

    <button type="submit" class="btn btn-primary w-100 py-2">🔍 Analyze Report</button>
  </form>

  {% if result and result.prediction %}
  <div class="result-box show">
    <h4 class="text-success mb-3">✅ Prediction</h4>
    <p class="fs-5"><strong>Disease:</strong> {{ result.prediction }}</p>

    <h5 class="text-info mt-4">📊 SHAP Explanation</h5>
    <p>{{ result.shap_text }}</p>
    {% if result.shap_plot_path %}
    <img src="{{ url_for('static', filename=result.shap_plot_path) }}" alt="SHAP plot" class="shap-img">
    {% endif %}

    <h5 class="text-info mt-4">🤖 AI Explanation</h5>
    <p>{{ result.deepseek_explanation }}</p>
  </div>
  {% endif %}
</div>

</body>
</html>
